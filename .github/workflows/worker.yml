---
# Cloudflare Worker: npm ci (lockfile) + build + tests (CLI tests use dist/), in Node 22 by digest.
name: worker
on:
  push:
    branches: [main]
    paths: ["worker/**", ".github/workflows/worker.yml"]
  pull_request:
    paths: ["worker/**", ".github/workflows/worker.yml"]
permissions: {}
concurrency:
  group: worker-${{ github.ref }}
  cancel-in-progress: true
jobs:
  worker:
    name: worker
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: npm ci, build, test (node 22.23.5, bookworm with openssl)
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp -e CI=true \
            -v "$PWD/worker:/worker" -w /worker \
            node:22-bookworm@sha256:e13726ca604184d7a91fcacab1fc09eefd642dc28e79ac34e85540dd93b78cfb \
            sh -euc 'npm ci --ignore-scripts --no-audit --no-fund && npm run build && npm test'
