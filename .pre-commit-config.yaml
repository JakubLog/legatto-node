---
# Remote hooks are pinned to a full commit SHA; local hooks use tools already
# installed on the machine (no downloads at hook time).
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: 83d9cd684c87d95d656c1458ef04895a7f1cbd8e  # frozen: v8.30.1
    hooks:
      - id: gitleaks
  - repo: local
    hooks:
      - id: check-actions-pinned
        name: actions by SHA, images by digest
        entry: scripts/check-actions-pinned.sh
        language: system
        pass_filenames: false
        files: ^(\.github/|\.pre-commit-config\.yaml$|.*Dockerfile)
      - id: yamllint
        name: yamllint
        entry: yamllint --strict
        language: system
        types: [yaml]
      - id: shellcheck
        name: shellcheck
        # the upstream Supabase copy is pinned, not ours
        entry: shellcheck --severity=style -x
        language: system
        types: [shell]
        exclude: ^bundle/compose/supabase/
