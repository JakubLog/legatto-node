    size: 14999984
    member: lego
    upstream_signature: none     # checksums.txt only
    verified:
      - GitHub release asset digest (API)
      - lego_5.6.0_checksums.txt
      - local sha256 of the downloaded file
  smokescreen:
    version: "0.1.0"
    url: https://github.com/stripe/smokescreen/releases/download/v0.1.0/smokescreen_v0.1.0_linux_amd64.tar.gz
    sha256: 4e1e447449e3cc653dae956208588722b5c8fe8ce894f633adc756a851d1ec46
    size: 5313984
    member: smokescreen_v0.1.0_linux_amd64/smokescreen   # path inside the tarball (tar tzf)
    upstream_signature: none     # SHA256SUMS only; no public container image
    verified:
      - GitHub release asset digest (API)
      - SHA256SUMS of the release
      - local sha256 of the downloaded file

# --- Docker Engine (APT repository download.docker.com, signed InRelease) -------------------
# Installed by the `docker` role at bootstrap; apt verifies packages through
# the signed repository, so versions are pinned and the key by fingerprint.
legatto_docker_apt:
  repo: https://download.docker.com/linux/ubuntu
  suite: noble
  component: stable
  key_url: https://download.docker.com/linux/ubuntu/gpg
  key_fingerprint: 9DC858229FC7DD38854AE2D88D81803C0EBFCD88
  packages:
    docker-ce: "5:29.10.0-1~ubuntu.24.04~noble"
    docker-ce-cli: "5:29.10.0-1~ubuntu.24.04~noble"
    containerd.io: "2.4.2-4~ubuntu.24.04~noble"
    docker-compose-plugin: "5.8.0-1~ubuntu.24.04~noble"
    docker-buildx-plugin: "0.39.1-1~ubuntu.24.04~noble"

