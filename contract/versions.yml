---
# Pinned upstream versions, hashes and image digests. Owner: integrator.
#
# Rules (Aneks 1 pkt 4):
#   - every artifact is pinned by sha256, every image by digest; tags are
#     comments for humans only;
#   - a value is written here only after it was checked against two
#     independent sources (listed in `verified`); unknown values are left out,
#     never guessed;
#   - bumps go through manual review (Renovate without auto-merge).
#
# Consumers: the bootstrap roles (first install of .deb/binaries on a host)
# and release/ tooling (composing the signed bundle). After bootstrap, servers
# receive these artifacts only inside a signed bundle, never from upstream.
#
# Target platform: Ubuntu 24.04 (noble), linux/amd64.
# Last verified: 2026-11-21.

legatto_versions_verified_on: "2026-11-21"
legatto_target_platform: linux/amd64

# --- Debian packages installed with `apt install ./<file>.deb` ----------------------------
legatto_debs:
  headscale:
    version: "0.29.7"            # security release 2026-10-30; upgrade path one minor at a time
    url: https://github.com/juanfont/headscale/releases/download/v0.29.7/headscale_0.29.7_linux_amd64.deb
    sha256: d230c5fc8db06cf1868f4ec0077b89e5e2ccf3b22a3259efa6d080db2d5f921c
    size: 20183728
    upstream_signature: none     # Headscale publishes no signatures or attestations
    verified:
      - GitHub release asset digest (API)
      - checksums.txt of the release
      - local sha256 of the downloaded file
  tailscale:
    version: "1.104.7"
    url: https://pkgs.tailscale.com/stable/ubuntu/pool/tailscale_1.104.7_amd64.deb
    sha256: a41efd469875e27b4d8f313e07476f9bae459bafab305a3f2621ff5b5254a885
    size: 40778580
    upstream_signature: >-
      apt repository: InRelease (noble) signed by 2596A99EAAB33821893C0A79458CA832957F5868
      -> main/binary-amd64/Packages sha256 05d54ccd3b1237b7e74dc22b9a4aeaf07212006b85eaae97e36f4b2eefab424a
      -> this .deb
    verified:
      - gpgv of InRelease with the Tailscale repository key
      - Packages index entry (SHA256, Size)
      - local sha256 of the downloaded file

# --- Static binaries (bundle kind "binary", installed to /opt/legatto/bin/<ver>/) ----------------
legatto_binaries:
  caddy:
    version: "2.11.9"
    url: https://github.com/caddyserver/caddy/releases/download/v2.11.9/caddy_2.11.9_linux_amd64.tar.gz
