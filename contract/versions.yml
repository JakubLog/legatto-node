      0e85544340290a16ce4bfb76fe7d65e9de1bf3a6e67f5ccfff30b30d27ea4c73e078077b7bf3e58ae60b6b12e44327705287059c775bca5782e8ee85ea7edd75
    size: 18020988
    member: caddy                # file inside the tarball
    upstream_signature: >-
      cosign keyless (Sigstore): caddy_2.11.9_linux_amd64.tar.gz.sig + caddy_2.11.9_linux_amd64.pem;
      verified by release tooling and the signer, not on servers
    verified:
      - GitHub release asset digest (API)
      - caddy_2.11.9_checksums.txt (sha512)
      - local sha256/sha512 of the downloaded file
  lego:
    version: "5.6.0"
    url: https://github.com/go-acme/lego/releases/download/v5.6.0/lego_v5.6.0_linux_amd64.tar.gz
